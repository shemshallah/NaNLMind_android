name: NaN16 CPU Ring Trainer

on:
  push:
    paths:
      - ".github/workflows/nan16-cpu-ring.yml"
      - "training/**"
  pull_request:
    paths:
      - ".github/workflows/nan16-cpu-ring.yml"
      - "training/**"
  workflow_dispatch:
    inputs:
      corpus_text:
        description: Small plain-text corpus (UTF-8, maximum 1 MiB)
        required: true
        type: string
        default: "NaN16 runner and Android share one corpus pipeline.\nThe NaN16 guest computes the corpus profile."

permissions:
  contents: read

jobs:
  point-1-runner:
    name: Point 1/256 — GitHub Runner CPU Ring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout NaNLMind Android control repository
        uses: actions/checkout@v4
      - name: Checkout NaN0S NaN16 runtime
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          path: NaN0S
      - name: Build NaN16 guest runner
        run: |
          make -C NaN0S/aarch64/android -s nan_cli
          awk -f NaN0S/tools/nmk.awk -v CMD=emit NaN0S/src/training/n16_train.nas > "$RUNNER_TEMP/n16_train.nan"
          printf '%s' "$CORPUS_TEXT" > "$RUNNER_TEMP/corpus.txt"
        env:
          CORPUS_TEXT: ${{ inputs.corpus_text || 'NaN16 runner and Android share one corpus pipeline. The NaN16 guest computes the corpus profile.' }}
      - name: Run shared NaN16 corpus regression suite
        run: sh NaN0S/tools/n16_train_gate.sh

      - name: Execute shared NaN16 corpus pipeline
        run: |
          NaN0S/aarch64/android/nan_cli \
            --img "$RUNNER_TEMP/n16_train.nan" \
            --nannet-train "$RUNNER_TEMP/corpus.txt" \
            --serial \
            --candidate-out "$RUNNER_TEMP/candidate.nan1" \
            --peek 8448:3

      - name: Write candidate provenance and digests
        run: |
          {
            printf 'workflow_run=%s\\n' "$GITHUB_RUN_ID"
            printf 'control_repository=%s\\n' "$GITHUB_REPOSITORY"
            printf 'control_commit=%s\\n' "$GITHUB_SHA"
            printf 'runtime_repository=shemshallah/NaN0S\\n'
            printf 'runtime_commit=%s\\n' "$(git -C NaN0S rev-parse HEAD)"
            printf 'corpus_bytes=%s\\n' "$(wc -c < "$RUNNER_TEMP/corpus.txt" | tr -d ' ')"
            printf 'corpus_sha256=%s\\n' "$(sha256sum "$RUNNER_TEMP/corpus.txt" | cut -d ' ' -f 1)"
            printf 'candidate_bytes=%s\\n' "$(wc -c < "$RUNNER_TEMP/candidate.nan1" | tr -d ' ')"
            printf 'candidate_sha256=%s\\n' "$(sha256sum "$RUNNER_TEMP/candidate.nan1" | cut -d ' ' -f 1)"
          } > "$RUNNER_TEMP/candidate-manifest.txt"
          sha256sum "$RUNNER_TEMP/candidate.nan1" > "$RUNNER_TEMP/candidate.nan1.sha256"

      - name: Publish isolated candidate checkpoint and provenance
        uses: actions/upload-artifact@v4
        with:
          name: nan16-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/candidate.nan1
            ${{ runner.temp }}/candidate.nan1.sha256
            ${{ runner.temp }}/candidate-manifest.txt
          if-no-files-found: error
          retention-days: 7
