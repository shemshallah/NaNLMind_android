name: NaNLMind_ANDROID Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned NaN0S boot image
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: ad2225f2a61a888287a0f5631aca63fe091296f1
          path: .nan0s-upstream
          sparse-checkout: |
            aarch64/android/app/src/main/assets/nan0s.img
          sparse-checkout-cone-mode: false
      - name: Stage and verify boot image
        run: |
          mkdir -p aarch64/android/app/src/main/assets
          cp .nan0s-upstream/aarch64/android/app/src/main/assets/nan0s.img aarch64/android/app/src/main/assets/nan0s.img
          test "$(wc -c < aarch64/android/app/src/main/assets/nan0s.img)" -eq 1474560
      - name: Run native regression suite
        working-directory: aarch64/android
        run: |
          make test
          make asan
          make seals
          ./nan_cli --help | grep -q "nannet-training"
          ./nan_cli --help | grep -q -- "--candidate-out"

  apk:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned NaN0S sources
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: ad2225f2a61a888287a0f5631aca63fe091296f1
          path: .nan0s-upstream
      - name: Build Android desktop-only boot image
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk xxd
          cd .nan0s-upstream
          # Android stays in the desktop shell after a guest app (including NSH) returns.
          # The museum catalog is therefore never entered on this Android boot path.
          sed -i '/^sh_after_prog:$/,/^JMP @sh_redraw$/c\
          sh_after_prog:\
          LA r10,@boot_rec\
          LD r1,r10,0\
          CMP r1,r0\
          JMP[EQ] @sh_after_menu\
          JMP @sh_run\
          sh_after_menu:\
          MOVI r13,1\
          JMP @sh_redraw' src/museum/shell.nas
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/exhibits/gui_cart.nas")
          s = p.read_text()
          old = "CALL @pci_scan\nCALL @pci_nic"
          new = "CALL @wm_wbase\nMOVI r2,3\nST r2,r1,#W_A3"
          if old not in s:
              raise SystemExit("Android NaNNet init patch target not found")
          s = s.replace(old, new, 1)
          s = s.replace('.str "NaNNet  NETWORK CONTROL  (DRIVER PENDING)"',
                        '.str "NaNNet  ANDROID NETWORK MANAGER"')
          s = s.replace('.str "ADAPTER"', '.str "NETWORK"')
          s = s.replace('.str "NONE ON PCI BUS 0"', '.str "ANDROID WIFI / CELLULAR ROUTE"')
          s = s.replace('.str "NO ADAPTER FOUND"', '.str "HOST NETWORK VIA ANDROID"')
          s = s.replace('.str "ADAPTER FOUND, NO DRIVER YET (STUB)"',
                        '.str "ANDROID HOST NETWORK ACTIVE"')
          if "NONE ON PCI BUS 0" in s or "NO ADAPTER FOUND" in s:
              raise SystemExit("Android NaNNet PCI-only status remains")
          p.write_text(s)
          # Android boots straight into the GUI desktop. NSH is the Android-host
          # desktop child window; do not create a second guest terminal at boot.
          p = Path("src/exhibits/gui_cart.nas")
          s = p.read_text()
          boot = chr(10).join(["MOVI r1,0", "CALL @gui_open_new", "MOVI r1,1", "ST r1,r0,@wm_redraw"])
          if boot not in s:
              raise SystemExit("desktop boot-window block not found")
          s = s.replace(boot, """MOVI r1,1
          ST r1,r0,@wm_redraw""", 1)
          # The browser demo used terminal-buffer redraw on every WM paint.
          # Render a small static browser window directly to the framebuffer;
          # network browsing is provided by the Android host from NSH.
          start = s.index("br_show:")
          end = s.index("br_init:", start)
          safe_show = """br_show:
          ST r15,r0,@bs_ret
          LD r1,r0,@br_id
          CALL @g_clr
          LD r1,r0,@br_id
          CALL @tx_org
          MOVI r1,0
          MOVI r2,0
          MOVI r3,@br_tabs
          MOVI r4,#C_CY
          CALL @tx_s
          MOVI r1,0
          MOVI r2,2
          MOVI r3,@br_status
          MOVI r4,#C_DIM
          CALL @tx_s
          LD r1,r0,@br_tab
          SHL r1,r1,2
          MOVI r2,@br_pages
          ADD r1,r1,r2
          LD r3,r1,0
          LD r1,r0,@br_id
          MOVI r2,4
          MOVI r4,#C_TXT
          CALL @tx_s
          LD r15,r0,@bs_ret
          RET
          """
          s = s[:start] + safe_show + s[end:]
          s = s.replace("""          CALL @term_fit
          MOVI r1,0
          ST r1,r0,@br_tab""", """          MOVI r1,0
          ST r1,r0,@br_tab""", 1)
          # No final-window auto-exit: closing a window returns to the desktop.
          s = s.replace("""          LD r1,r0,@wm_zn
          CMP r1,r0
          JMP[EQ] @g_exit
          CALL @kbd_poll""", """          CALL @kbd_poll""", 1)
          # "f" no longer transfers control to the hidden storage-shell cart.
          s = s.replace("""          tm_nsh:
          MOVI r1,4800
          MOVI r2,10
          ST r2,r1,0
          MOVI r1,1
          ST r1,r0,@g_quit""", """          tm_nsh:
          MOVI r1,0
          CALL @gui_open_new""", 1)
          s = s.replace('.str "TERMINAL"', '.str "NSH TERMINAL"', 1)
          s = s.replace('.str "f files (nsh) q quit gui\\n"', '.str "f open terminal  q close desktop\\n"', 1)
          p.write_text(s)
          PY
          sh tools/build.sh
          sh tools/browser_gate.sh
          mkdir -p ../aarch64/android/app/src/main/assets
          cp aarch64/android/app/src/main/assets/nan0s.img ../aarch64/android/app/src/main/assets/nan0s.img
          test "$(wc -c < ../aarch64/android/app/src/main/assets/nan0s.img)" -eq 1474560
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and build debug APK
        working-directory: aarch64/android
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NaNLMind-ANDROID-debug-apk
          path: |
            aarch64/android/app/build/outputs/apk/debug/app-debug.apk
            aarch64/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
