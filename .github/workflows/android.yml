name: NaNLMind_ANDROID Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned NaN0S boot image
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: ad2225f2a61a888287a0f5631aca63fe091296f1
          path: .nan0s-upstream
          sparse-checkout: |
            aarch64/android/app/src/main/assets/nan0s.img
          sparse-checkout-cone-mode: false
      - name: Fetch NaN0S assembler and guest runtime
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: ad2225f2a61a888287a0f5631aca63fe091296f1
          path: .nan0s-toolchain
      - name: Fetch pinned NaNROUTER MTH admission sources
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          ref: a1e033da5ee76680d04a1b9d9fd4cbbab999913d
          path: .nanrouter-upstream
      - name: Verify vendored NaN16 admission sources
        run: |
          cmp .nanrouter-upstream/mth/nan16/mth_preflight_gate.nas src/mth/mth_preflight_gate.nas
          cmp .nanrouter-upstream/mth/nan16/mth_preflight.nas src/mth/mth_preflight.nas
          cmp .nanrouter-upstream/mth/nan16/mth_admission.nas src/mth/mth_admission.nas
      - name: Stage and verify boot image
        run: |
          mkdir -p aarch64/android/app/src/main/assets
          cp .nan0s-upstream/aarch64/android/app/src/main/assets/nan0s.img aarch64/android/app/src/main/assets/nan0s.img
          test "$(wc -c < aarch64/android/app/src/main/assets/nan0s.img)" -eq 1474560
      - name: Assert NSH is guest-owned, not an Android overlay
        run: |
          ! grep -q 'showNshWindow' aarch64/android/app/src/main/java/org/nan0s/vm/MainActivity.kt
          ! grep -q 'nshHelp()' aarch64/android/app/src/main/java/org/nan0s/vm/MainActivity.kt
      - name: Run native regression suite
        working-directory: aarch64/android
        run: |
          make test
          make asan
          make seals
          ./nan_cli --help | grep -q "nannet-training"
          ./nan_cli --help | grep -q -- "--candidate-out"
      - name: Run composed native NaN16 mathematical admission gate
        run: NAN16_ROOT=.nan0s-toolchain sh tools/n16_math_admission_gate.sh
      - name: Run native NaN16 payload-range preflight regression
        run: NAN16_ROOT=.nan0s-toolchain sh tools/n16_math_preflight_range_test.sh
      - name: Run native NaN16 raw receipt emission regression
        run: NAN16_ROOT=.nan0s-toolchain sh tools/n16_math_guest_receipt_test.sh

  apk:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned NaN0S sources
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: ad2225f2a61a888287a0f5631aca63fe091296f1
          path: .nan0s-upstream
      - name: Fetch pinned NaNROUTER MTH admission sources
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          ref: a1e033da5ee76680d04a1b9d9fd4cbbab999913d
          path: .nanrouter-upstream
      - name: Verify vendored NaN16 admission sources
        run: |
          cmp .nanrouter-upstream/mth/nan16/mth_preflight_gate.nas src/mth/mth_preflight_gate.nas
          cmp .nanrouter-upstream/mth/nan16/mth_preflight.nas src/mth/mth_preflight.nas
          cmp .nanrouter-upstream/mth/nan16/mth_admission.nas src/mth/mth_admission.nas
      - name: Build Android desktop-only boot image
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk xxd
          cd .nan0s-upstream
          cp ../src/android/desktop_input.inc src/exhibits/android_desktop_input.inc
          perl ../tools/android_guest_patch.pl
          sh tools/build.sh
          mkdir -p ../aarch64/android/app/src/main/assets
          cp aarch64/android/app/src/main/assets/nan0s.img ../aarch64/android/app/src/main/assets/nan0s.img
          test "$(wc -c < ../aarch64/android/app/src/main/assets/nan0s.img)" -eq 1474560
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and build debug APK
        working-directory: aarch64/android
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NaNLMind-ANDROID-debug-apk
          path: |
            aarch64/android/app/build/outputs/apk/debug/app-debug.apk
            aarch64/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
